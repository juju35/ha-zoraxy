name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "custom_components/**/frontend/**"
      - "scripts/**"

# Protected main is never pushed to: the job commits the refreshed screenshots
# back onto the pull request's own branch, so they land through the normal merge.
permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Render screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a fork pull request the head branch only exists in the fork:
          # checkout it from there (the commit step below never pushes to forks).
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install playwright
      # Download the browser binary (no apt here) separately from its system libraries, so the apt work all sits in
      # the one time-boxed, retried step below and a hung mirror can never stall an unguarded install.
      - run: playwright install chromium
      # Roboto + the browser's apt deps, each apt call time-boxed and retried so a flaky mirror is
      # abandoned and retried instead of hanging. No ffmpeg: this card has no animation to record.
      - name: Install Roboto and browser deps
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get update \
              && timeout 300 sudo apt-get install -y fonts-roboto \
              && timeout 300 playwright install-deps chromium \
              && break
            echo "apt attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
      - name: Render screenshots
        run: |
          set -o pipefail
          python scripts/screenshots.py 2>&1 | tee /tmp/screenshots.log || {
            echo "::error::screenshots failed: $(tail -c 1200 /tmp/screenshots.log | tr -d '\r' | tr '\n' ' ')"
            exit 1
          }
      - name: Commit refreshed screenshots
        # Push only from a same-repo pull request branch: GITHUB_TOKEN has no
        # write access on fork branches, and manual runs upload an artifact instead.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain screenshots)" ]; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "chore: refresh screenshots"
          git push
      - name: Upload screenshots artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: screenshots
          path: screenshots/
